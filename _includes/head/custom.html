<!-- Resolve the theme before anything paints, otherwise a dark-mode visitor gets
     a white flash on every navigation. Runs first in the head on purpose. -->
<script>
(function () {
  var stored = null;
  try { stored = window.localStorage.getItem('theme'); } catch (e) {}
  var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme', stored || (prefersDark ? 'dark' : 'light'));
})();
</script>

<script>
(function () {
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  document.addEventListener('DOMContentLoaded', function () {
    // theme switch; the initial value was already applied by the head script
    var root = document.documentElement;
    var toggle = document.querySelector('.theme-toggle');
    var themeMeta = document.querySelector('meta[name="theme-color"]');

    function applyTheme(theme) {
      root.setAttribute('data-theme', theme);
      if (themeMeta) themeMeta.setAttribute('content', theme === 'dark' ? '#0d1117' : '#ffffff');
      if (!toggle) return;
      var label = theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme';
      toggle.setAttribute('aria-label', label);
      toggle.setAttribute('title', label);
      toggle.setAttribute('aria-pressed', theme === 'dark' ? 'true' : 'false');
    }

    applyTheme(root.getAttribute('data-theme') === 'dark' ? 'dark' : 'light');

    if (toggle) {
      toggle.addEventListener('click', function () {
        var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        applyTheme(next);
        try { window.localStorage.setItem('theme', next); } catch (e) {}
      });
    }

    // follow the OS unless the visitor has made an explicit choice
    if (window.matchMedia) {
      var scheme = window.matchMedia('(prefers-color-scheme: dark)');
      var onSchemeChange = function (event) {
        var chosen = null;
        try { chosen = window.localStorage.getItem('theme'); } catch (e) {}
        if (!chosen) applyTheme(event.matches ? 'dark' : 'light');
      };
      if (scheme.addEventListener) scheme.addEventListener('change', onSchemeChange);
      else if (scheme.addListener) scheme.addListener(onSchemeChange);
    }

    var bar = document.createElement('div');
    bar.className = 'scroll-progress';
    document.body.appendChild(bar);

    var toTop = document.createElement('button');
    toTop.className = 'back-to-top';
    toTop.type = 'button';
    toTop.setAttribute('aria-label', 'Back to top');
    toTop.innerHTML = '<i class="fas fa-arrow-up" aria-hidden="true"></i>';
    document.body.appendChild(toTop);

    toTop.addEventListener('click', function () {
      window.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' });
    });

    var ticking = false;
    function onScroll() {
      if (ticking) return;
      ticking = true;
      window.requestAnimationFrame(function () {
        var scrollable = document.documentElement.scrollHeight - window.innerHeight;
        var ratio = scrollable > 0 ? window.pageYOffset / scrollable : 0;
        bar.style.transform = 'scaleX(' + Math.min(Math.max(ratio, 0), 1) + ')';
        toTop.classList.toggle('is-visible', window.pageYOffset > 400);
        ticking = false;
      });
    }
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();

    // highlight the masthead link of the section currently in view
    var spied = [];
    Array.prototype.forEach.call(document.querySelectorAll('#site-nav a[href*="#"]'), function (link) {
      var id = link.getAttribute('href').split('#')[1];
      var section = id && document.getElementById(id);
      if (section) spied.push({ link: link, section: section });
    });

    if (spied.length) {
      var masthead = document.querySelector('.masthead');
      var spying = false;

      function top(el) {
        return el.getBoundingClientRect().top + window.pageYOffset;
      }

      spied.sort(function (a, b) { return top(a.section) - top(b.section); });

      function spy() {
        if (spying) return;
        spying = true;
        window.requestAnimationFrame(function () {
          var line = window.pageYOffset + (masthead ? masthead.offsetHeight : 0) + 24;
          var current = null;
          spied.forEach(function (entry) {
            if (top(entry.section) <= line) current = entry;
          });

          // the last sections can never reach the line, so claim them at the bottom
          var atBottom = window.innerHeight + window.pageYOffset >= document.documentElement.scrollHeight - 2;
          if (atBottom) current = spied[spied.length - 1];

          spied.forEach(function (entry) {
            entry.link.classList.toggle('is-active', entry === current);
          });
          spying = false;
        });
      }

      window.addEventListener('scroll', spy, { passive: true });
      window.addEventListener('resize', spy);
      spy();
    }

    if (reduceMotion || !('IntersectionObserver' in window)) return;

    var targets = document.querySelectorAll('.pub-card, .exp-card, .visitor-map, .page__content > h1');
    if (!targets.length) return;

    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (!entry.isIntersecting) return;
        entry.target.classList.add('is-visible');
        observer.unobserve(entry.target);
      });
    }, { rootMargin: '0px 0px -8% 0px', threshold: 0.06 });

    targets.forEach(function (el) {
      el.classList.add('reveal');
      observer.observe(el);
    });
  });
})();
</script>
