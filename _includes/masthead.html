<div class="masthead">
  <div class="masthead__inner-wrap">
    <a class="site-brand" href="/">{{ site.title }}<span class="site-brand-dot">.</span></a>
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><div class="navicon"></div></button>
        <ul class="visible-links">
          {% for link in site.data.navigation.main %}
            <li class="masthead__menu-item"><a href="{{ domain }}{{ link.url }}">{{ link.title }}</a></li>
          {% endfor %}
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
    <button class="theme-toggle" type="button" aria-label="Switch to dark theme" title="Switch to dark theme">
      <i class="fas fa-moon theme-toggle-moon" aria-hidden="true"></i>
      <i class="fas fa-sun theme-toggle-sun" aria-hidden="true"></i>
    </button>
  </div>
</div>
